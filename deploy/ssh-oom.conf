# 10-23 进度表 97 ③: on 10-22 a build ate the last of a 4 GB machine; sshd kept accepting key logins but no login shell
# could get a page, so for an hour the site answered and SSH did not. sshd now sits beside the site at the back of the
# OOM killer's list (yaoflow.service is −900 too, yaoflow-admin −500); builds run under `choom -n 500` and go first.
# Install: sudo cp deploy/ssh-oom.conf /etc/systemd/system/ssh.service.d/oom.conf && sudo systemctl daemon-reload && sudo systemctl restart ssh
[Service]
OOMScoreAdjust=-900
