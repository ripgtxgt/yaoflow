# 11-27 (Sakura：「为什么不拦访问呢，同样的机器爬虫啊」): requests from automation browsers, and from desktop browsers about
# a year and a half out of date, are closed at the door. 10-28..11-27: 500 browsers with such a desktop UA, none of
# them ever cast, went to checkout or signed in; Lightpanda 22, all crawlers. Self-declared crawlers (Googlebot,
# bingbot, AdsBot, facebookexternalhit, UptimeRobot …) pass, phones always pass. Same rule as lib/machine-ua.ts,
# with the version floor written out: Chrome/Edge < 137, Firefox < 139 (11-27), sparing the last versions old systems
# run (Chrome 109 / 116 / 128, Firefox ESR 115). Raise the floor by about one a month (lib/machine-ua.ts computes it).
# `map` lives in the http context; this file is included there.
map $http_user_agent $yf_block_ua {
    default 0;
    "~*(bot|crawl|spider|slurp)" 0;
    "~*(lightpanda|headlesschrome|phantomjs|puppeteer|playwright|selenium|jsdom)" 1;
    "~*(mobi|android|iphone|ipad|ipod)" 0;
    "~(Chrome|Edg)/(?!109\.|116\.|128\.)([1-9][0-9]|1[0-2][0-9]|13[0-6])\." 1;
    "~Firefox/(?!115\.)([1-9][0-9]|1[0-2][0-9]|13[0-8])\." 1;
}

server {
    server_name yaoflow.com www.yaoflow.com;

    # one host only: www served the whole site as a second copy (every page
    # twice for Google); send it to the apex, keeping the path and query
    if ($host = www.yaoflow.com) {
        return 301 https://yaoflow.com$request_uri;
    }

    # 11-27: automation browsers and two-year-old desktop browsers (map above) — closed, never reach the site
    if ($yf_block_ua) {
        return 444;
    }

    # 10-13 防崩溃 ① (deploy/README-ops.md): the back office runs in its own process (yaoflow-admin, :3201) so a slow
    # admin page cannot stall readers — except the live board, whose presence table lives in the site's process
    location = /admin/live {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_buffering off;
        proxy_send_timeout 180s;
    }
    location ^~ /api/admin/live {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_buffering off;
        proxy_send_timeout 180s;
    }
    location ^~ /admin {
        proxy_pass http://127.0.0.1:3201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_buffering off;
        proxy_send_timeout 180s;
    }
    location ^~ /api/admin/ {
        proxy_pass http://127.0.0.1:3201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_buffering off;
        proxy_send_timeout 180s;
    }

    # 11-06 (Neil：「这种要怎么去防止呢」): vulnerability scanners ask for secrets files, git metadata and WordPress/PHP
    # pages. None exist here (all 404 already); close the connection at nginx so they never reach the site process.
    # .well-known (certificates) is not matched.
    location ~* ((^|/)\.(env|git|svn|hg|aws|ds_store|htaccess|htpasswd)|\.env($|\.)|\.(php|asp|aspx|jsp|cgi)$|/(wp-admin|wp-login|wp-content|wp-includes|xmlrpc|phpmyadmin|pma)(/|$|\.)) {
        return 444;
    }

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_buffering off;
        proxy_send_timeout 180s;
    }

    listen 443 ssl; http2 on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/yaoflow.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/yaoflow.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.yaoflow.com) {
        return 301 https://yaoflow.com$request_uri;
    } # managed by Certbot (target changed to the apex)


    if ($host = yaoflow.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name yaoflow.com www.yaoflow.com;
    return 404; # managed by Certbot




}